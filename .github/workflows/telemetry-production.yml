name: Telemetry Production Build

on:
  push:
    paths:
      - .github/workflows/telemetry-production.yml
      - Projects/Applications/Telemetry/**
  pull_request:
    paths:
      - .github/workflows/telemetry-production.yml
      - Projects/Applications/Telemetry/**
  workflow_dispatch:

jobs:
  telemetry-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNU Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make zip

      - name: Build production firmware
        working-directory: Projects/Applications/Telemetry
        run: |
          make clean all
          ls -lah telemetry.elf telemetry.hex telemetry.bin telemetry.map

      - name: Package production artifacts
        working-directory: Projects/Applications/Telemetry
        env:
          TELEMETRY_DEVICE_ID: ${{ vars.TELEMETRY_DEVICE_ID || 'CI-DEMO-DEVICE' }}
          TELEMETRY_SERIAL_NUMBER: ${{ vars.TELEMETRY_SERIAL_NUMBER || 'CI-DEMO-SERIAL' }}
          TELEMETRY_BUSINESS_PROFILE: ${{ vars.TELEMETRY_BUSINESS_PROFILE || 'ci-default' }}
          TELEMETRY_LORAWAN_DEVICE_EUI: ${{ secrets.TELEMETRY_LORAWAN_DEVICE_EUI || '' }}
          TELEMETRY_LORAWAN_JOIN_EUI: ${{ secrets.TELEMETRY_LORAWAN_JOIN_EUI || '' }}
          TELEMETRY_LORAWAN_APP_KEY: ${{ secrets.TELEMETRY_LORAWAN_APP_KEY || '' }}
          TELEMETRY_LORAWAN_NWK_KEY: ${{ secrets.TELEMETRY_LORAWAN_NWK_KEY || '' }}
          TELEMETRY_LORAWAN_REGION: ${{ vars.TELEMETRY_LORAWAN_REGION || 'LORAMAC_REGION_EU868' }}
          TELEMETRY_LORAWAN_ACTIVATION: ${{ vars.TELEMETRY_LORAWAN_ACTIVATION || 'ACTIVATION_TYPE_OTAA' }}
          TELEMETRY_HEARTBEAT_MS: ${{ vars.TELEMETRY_HEARTBEAT_MS || '30000' }}
          TELEMETRY_ENFORCE_DEVICE_METADATA: ${{ vars.TELEMETRY_ENFORCE_DEVICE_METADATA || '1' }}
          TELEMETRY_ENFORCE_CUSTOM_KEYS: ${{ vars.TELEMETRY_ENFORCE_CUSTOM_KEYS || '0' }}
        run: |
          chmod +x scripts/package_production_artifacts.sh
          ./scripts/package_production_artifacts.sh
          ls -lah production-artifacts

      - name: Validate manifest files in production bundle
        run: |
          set -euo pipefail
          BUNDLE="Projects/Applications/Telemetry/production-artifacts/wio-e5-telemetry-production-bundle.zip"
          unzip -l "$BUNDLE" | grep -q "wio-e5-telemetry-production/docs/build_manifest_full.json"
          unzip -l "$BUNDLE" | grep -q "wio-e5-telemetry-production/docs/build_manifest_redacted.json"
          unzip -l "$BUNDLE" | grep -q "wio-e5-telemetry-production/docs/build_manifest_summary.txt"

      - name: Validate manifest schema and key fields
        run: |
          set -euo pipefail
          BUNDLE="Projects/Applications/Telemetry/production-artifacts/wio-e5-telemetry-production-bundle.zip"
          unzip -p "$BUNDLE" wio-e5-telemetry-production/docs/build_manifest_full.json > /tmp/build_manifest_full.json
          unzip -p "$BUNDLE" wio-e5-telemetry-production/docs/build_manifest_redacted.json > /tmp/build_manifest_redacted.json
          python3 <<'PY'
          import json
          import re

          with open('/tmp/build_manifest_full.json', encoding='utf-8') as f:
            full = json.load(f)
          with open('/tmp/build_manifest_redacted.json', encoding='utf-8') as f:
            redacted = json.load(f)

          required_paths = [
            ('build', 'git_sha'),
            ('device', 'device_id'),
            ('device', 'serial_number'),
            ('lorawan', 'device_eui'),
            ('lorawan', 'join_eui'),
            ('lorawan', 'app_key'),
            ('lorawan', 'nwk_key'),
            ('business_logic', 'profile'),
          ]

          for section, key in required_paths:
            if key not in full.get(section, {}):
              raise SystemExit(f"Missing full manifest field: {section}.{key}")

          if not re.fullmatch(r'[0-9A-F]{16}', full['lorawan']['device_eui']):
            raise SystemExit('Invalid device_eui format in full manifest')
          if not re.fullmatch(r'[0-9A-F]{16}', full['lorawan']['join_eui']):
            raise SystemExit('Invalid join_eui format in full manifest')
          if not re.fullmatch(r'[0-9A-F]{32}', full['lorawan']['app_key']):
            raise SystemExit('Invalid app_key format in full manifest')
          if not re.fullmatch(r'[0-9A-F]{32}', full['lorawan']['nwk_key']):
            raise SystemExit('Invalid nwk_key format in full manifest')

          for key in ['device_eui', 'join_eui', 'app_key', 'nwk_key']:
            masked = redacted.get('lorawan', {}).get(key, '')
            if '*' not in masked:
              raise SystemExit(f"Redacted manifest field is not masked: lorawan.{key}")

          if full.get('artifacts') is None or len(full['artifacts']) != 4:
            raise SystemExit('Expected 4 firmware artifacts in full manifest')
          PY

      - name: Upload production artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-production-bundle
          path: |
            Projects/Applications/Telemetry/production-artifacts/wio-e5-telemetry-production-bundle.zip
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          BUNDLE="Projects/Applications/Telemetry/production-artifacts/wio-e5-telemetry-production-bundle.zip"
          unzip -p "$BUNDLE" wio-e5-telemetry-production/docs/build_manifest_redacted.json > /tmp/build_manifest_redacted.json
          MANIFEST_GIT_SHA="$(python3 -c 'import json; print(json.load(open("/tmp/build_manifest_redacted.json"))["build"]["git_sha"])')"
          MANIFEST_DEVICE_ID="$(python3 -c 'import json; print(json.load(open("/tmp/build_manifest_redacted.json"))["device"]["device_id"])')"
          MANIFEST_REGION="$(python3 -c 'import json; print(json.load(open("/tmp/build_manifest_redacted.json"))["lorawan"]["region"])')"
          MANIFEST_PROFILE="$(python3 -c 'import json; print(json.load(open("/tmp/build_manifest_redacted.json"))["business_logic"]["profile"])')"

          echo "## Telemetry Production Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Production firmware build and packaging completed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundle contents" >> $GITHUB_STEP_SUMMARY
          unzip -l "$BUNDLE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build manifest (redacted)" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat /tmp/build_manifest_redacted.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Evidence Snippet" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "Production artifact evidence complete on commit ${GITHUB_SHA}." >> $GITHUB_STEP_SUMMARY
          echo "Manifest git_sha: ${MANIFEST_GIT_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "Manifest device_id: ${MANIFEST_DEVICE_ID}" >> $GITHUB_STEP_SUMMARY
          echo "Manifest region: ${MANIFEST_REGION}" >> $GITHUB_STEP_SUMMARY
          echo "Manifest business profile: ${MANIFEST_PROFILE}" >> $GITHUB_STEP_SUMMARY
          echo "Telemetry Production Build workflow: success." >> $GITHUB_STEP_SUMMARY
          echo "Artifact: telemetry-production-bundle." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
